[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "anytensor"
dynamic = ["version"]
description = "Portable tensor ops across NumPy, JAX, PyTorch, and TensorFlow, with segment/GNN primitives."
readme = "README.md"
license = "MIT"
authors = [
  { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "array-api-compat>=1.15",
  "einops>=0.8.1",
  "numpy>=1.24",
  "jaxtyping>=0.2.34",
]

[project.optional-dependencies]
jax = ["jax>=0.4.32"]
torch = ["torch>=2.1"]
tensorflow = ["tensorflow>=2.13"]
typecheck = ["beartype>=0.18"]
all = [
  "jax>=0.4.32",
  "torch>=2.1",
  "tensorflow>=2.13",
  "beartype>=0.18",
]

[project.urls]
Repository = "https://github.com/swamidass/anytensor"
Issues = "https://github.com/swamidass/anytensor/issues"
Documentation = "https://swamidass.github.io/anytensor/"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "beartype>=0.18",
  "jraph",
  "towncrier>=24",
  "hatch>=1.12",
  "ruff>=0.8",
  "sybil>=9.3.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "anytensor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["anytensor"]

[tool.hatch.build.targets.sdist]
include = [
  "/anytensor",
  "/test",
  "/docs",
  "/ci",
  "/mkdocs.yml",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/changelog.d",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["test", "docs"]
pythonpath = [".", "test"]
fuzz_examples = 1000
norecursedirs = [
  ".*",
  "build",
  "dist",
  "CVS",
  "_darcs",
  "{arch}",
  "*.egg",
  "venv",
  ".venv",
  "site",
  "artifacts",
  ".hypothesis",
]
# Sybil only executes docs/examples.md (see test/docs_sybil.py).
markers = [
  "fuzz: Hypothesis / cross-backend fuzz (excluded from the coverage gate)",
]
filterwarnings = [
  # Beartype still emits these for some nested / re-exported hints under the hook.
  "ignore::beartype.roar.BeartypeDecorHintPep585DeprecationWarning",
  # TF AutoGraph / gast noise under Sybil-executed doc examples.
  "ignore::DeprecationWarning:gast",
  # Legacy TorchScript tests + remaining divert; PyTorch deprecates script/trace.
  "ignore:`torch.jit.script` is deprecated:FutureWarning",
  "ignore:`torch.jit.trace` is deprecated:FutureWarning",
  # Dynamo tracing array-api-compat's lru_cache helpers (harmless; graph still runs).
  "ignore:Dynamo detected a call to a `functools.lru_cache`-wrapped function:UserWarning",
  # NaN / empty-segment fuzz hits intentional ±inf and 0/0 paths.
  "ignore:invalid value encountered in:RuntimeWarning",
  # Trace size checks and constant fills under legacy jit.trace paths.
  # Message-only: a torch.jit.* category would import torch during pytest startup
  # (before anytensor), hiding enable_torchscript()'s "torch not imported" branch.
  "ignore:Converting a tensor to a Python boolean",
  "ignore:torch.tensor results are registered as constants",
]

[tool.coverage.run]
branch = true
source = ["anytensor"]
omit = [
  "anytensor/_version.py",
  "anytensor/backends.py",
  "anytensor/torchscript.py",
  "anytensor/jraph/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "except ImportError",
]

[tool.towncrier]
package = "anytensor"
package_dir = "."
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## {version} ({project_date})"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
