[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "anytensor"
dynamic = ["version"]
description = "Portable tensor ops across NumPy, JAX, PyTorch, and TensorFlow, with segment/GNN primitives."
readme = "README.md"
license = "MIT"
authors = [
  { name = "S. Joshua Swamidass", email = "swamidass@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
  "array-api-compat>=1.4",
  "einops>=0.8.1",
]

[project.optional-dependencies]
jax = ["jax>=0.4.32"]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.10"]
all = [
  "jax>=0.4.32",
  "torch>=2.0",
  "tensorflow>=2.10",
]

[project.urls]
Repository = "https://github.com/swamidass/anytensor"
Issues = "https://github.com/swamidass/anytensor/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "towncrier>=24",
  "hatch>=1.12",
  "ruff>=0.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "anytensor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["anytensor"]

[tool.hatch.build.targets.sdist]
include = [
  "/anytensor",
  "/test",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/changelog.d",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["test"]
pythonpath = ["."]

[tool.towncrier]
package = "anytensor"
package_dir = "."
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## {version} ({project_date})"
issue_format = "#{issue}"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
