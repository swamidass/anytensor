# Tag-gated release: a v* tag only produces release artifacts if tests pass.
# Pushing a tag always creates the git tag; this workflow refuses to publish
# a GitHub Release / PyPI upload unless the suite is green.
#
# PyPI uses Trusted Publishing (OIDC) — no API token secret. One-time setup
# when the project is ready on PyPI:
#   1. GitHub environment "pypi" (tag-restricted to v*) — already created
#   2. PyPI → Publishing → add trusted publisher (pending if the project is new):
#        owner: swamidass
#        repo: anytensor
#        workflow: release.yml
#        environment: pypi
# Docs: https://docs.pypi.org/trusted-publishers/

name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with all backends + dev
        run: uv sync --extra all --group dev
      - name: Show package version
        run: uv run python -c "import anytensor as m; print(m.__version__)"
      - name: Require clean release version on tags
        run: |
          ver=$(uv run python -c "import anytensor as m; print(m.__version__)")
          echo "version=$ver"
          case "$ver" in
            *dev*|*+*|*.d[0-9]*)
              echo "Tagged builds must resolve to a clean X.Y.Z (got $ver)"
              echo "Tag a clean commit and ensure the working tree matches the tag."
              exit 1
              ;;
          esac
      - name: Unit / contract tests (coverage gate)
        run: >
          uv run pytest -m "not fuzz"
          --cov=anytensor
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Fuzz (bounded)
        run: uv run pytest -m fuzz --fuzz-examples=200

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Version without v prefix
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Compile CHANGELOG.md from towncrier fragments
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          if grep -Eq "^## ${VERSION}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md already has ${VERSION}"
          else
            uvx towncrier build --yes --version "$VERSION"
          fi
          git add CHANGELOG.md changelog.d
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git commit -m "Update CHANGELOG.md for ${GITHUB_REF_NAME}."
          git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}" || \
            echo "::warning::Could not fast-forward default branch with CHANGELOG.md."
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anytensor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
